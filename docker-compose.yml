version: "3.9"

services:

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api-gateway
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api-gateway:8000
      - NODE_ENV=production
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    environment:
      - BUSINESS_SERVICE_URL=http://business-service:8001
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:8002
      - INGESTION_SERVICE_URL=http://ingestion-service:8003
      - CORS_ORIGINS=http://localhost:3000,http://localhost,http://frontend:3000
    depends_on:
      business-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  business-service:
    build: ./services/business-service
    ports:
      - "8001:8001"
      - "50051:50051"
    environment:
      - DATABASE_URL=postgresql://postgres:stipe245gaba@db:5432/yelp
      - CORS_ORIGINS=http://localhost:8000,http://api-gateway:8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  recommendation-service:
    build: ./services/recommendation-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://postgres:stipe245gaba@db:5432/yelp
      - BUSINESS_SERVICE_GRPC=business-service:50051
      - CORS_ORIGINS=http://localhost:8000,http://api-gateway:8000
    depends_on:
      business-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingestion-service:
    build: ./services/ingestion-service
    ports:
      - "8003:8003"
    volumes:
      - ./infrastructure/data/raw:/data/raw:ro
    environment:
      - DATABASE_URL=postgresql://postgres:stipe245gaba@db:5432/yelp
      - DATA_PATH=/data/raw
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: yelp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: stipe245gaba
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d yelp" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
