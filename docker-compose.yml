services:

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api-gateway
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - API_URL=${API_URL:-http://api-gateway:8000}
      - NODE_ENV=production
      - NEXT_PUBLIC_SHOW_SEARCH_DEBUG=${NEXT_PUBLIC_SHOW_SEARCH_DEBUG:-0}
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - BUSINESS_SERVICE_URL=${BUSINESS_SERVICE_URL:-http://business-service:8001}
      - RECOMMENDATION_SERVICE_URL=${RECOMMENDATION_SERVICE_URL:-http://recommendation-service:8002}
      - INGESTION_SERVICE_URL=${INGESTION_SERVICE_URL:-http://ingestion-service:8003}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://business-service:8001}
      - USER_STATUS_PATH_TEMPLATE=${USER_STATUS_PATH_TEMPLATE:-/users/{user_id}/status}
      - USER_STATUS_TIMEOUT_SECONDS=${USER_STATUS_TIMEOUT_SECONDS:-3}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ISSUER=${JWT_ISSUER:-yelp-auth}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-yelp-api}
      - JWT_LEEWAY_SECONDS=${JWT_LEEWAY_SECONDS:-5}
      - JWT_ROLES_CLAIM=${JWT_ROLES_CLAIM:-roles}
      - BUSINESS_REQUIRED_ROLES=${BUSINESS_REQUIRED_ROLES:-business:read}
      - RECOMMENDATION_REQUIRED_ROLES=${RECOMMENDATION_REQUIRED_ROLES:-recommendation:read}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost,http://frontend:3000}
      - OTEL_TRACES_ENABLED=${OTEL_TRACES_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=${OTEL_EXPORTER_OTLP_INSECURE:-true}
    depends_on:
      business-service:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  business-service:
    build: ./services/business-service
    ports:
      - "8001:8001"
      - "50051:50051"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${BUSINESS_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-change_me}@db:5432/yelp}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://api-gateway:8000}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_pass}@redis:6379/0
      - REDIS_TIMEOUT_SECONDS=${REDIS_TIMEOUT_SECONDS:-0.2}
      - CACHE_ROLLOUT_PERCENT=${CACHE_ROLLOUT_PERCENT:-100}
      - CACHE_SHADOW_MODE=${CACHE_SHADOW_MODE:-false}
      - OTEL_TRACES_ENABLED=${OTEL_TRACES_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=${OTEL_EXPORTER_OTLP_INSECURE:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  recommendation-service:
    build: ./services/recommendation-service
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${RECOMMENDATION_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-change_me}@db:5432/yelp}
      - BUSINESS_SERVICE_GRPC=${BUSINESS_SERVICE_GRPC:-business-service:50051}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://api-gateway:8000}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_pass}@redis:6379/0
      - REDIS_TIMEOUT_SECONDS=${REDIS_TIMEOUT_SECONDS:-0.2}
      - CACHE_ROLLOUT_PERCENT=${CACHE_ROLLOUT_PERCENT:-100}
      - CACHE_SHADOW_MODE=${CACHE_SHADOW_MODE:-false}
      - OTEL_TRACES_ENABLED=${OTEL_TRACES_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=${OTEL_EXPORTER_OTLP_INSECURE:-true}
    depends_on:
      business-service:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingestion-service:
    build: ./services/ingestion-service
    ports:
      - "8003:8003"
    volumes:
      - ./infrastructure/data/raw:/data/raw:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=${INGESTION_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-change_me}@db:5432/yelp}
      - DATA_PATH=${DATA_PATH:-/data/raw}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_pass}@redis:6379/0
      - REDIS_TIMEOUT_SECONDS=${REDIS_TIMEOUT_SECONDS:-0.2}
      - OTEL_TRACES_ENABLED=${OTEL_TRACES_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - OTEL_EXPORTER_OTLP_INSECURE=${OTEL_EXPORTER_OTLP_INSECURE:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 3600 1 --save 300 100 --save 60 10000 --requirepass ${REDIS_PASSWORD:-dev_redis_pass}
    volumes:
      - redis_data:/data
    restart: unless-stopped

  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yelp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d yelp" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
      - "4317:4317"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  grafana_data:
