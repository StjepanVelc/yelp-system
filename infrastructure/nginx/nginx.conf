worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Upstream services
    upstream frontend {
        server frontend:3000;
    }

    upstream api_gateway {
        server api-gateway:8000;
    }

    upstream business_service {
        server business-service:8001;
    }

    upstream recommendation_service {
        server recommendation-service:8002;
    }

    upstream ingestion_service {
        server ingestion-service:8003;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Public API — proxied to api-gateway (strips /api prefix) ──────
        location /api/ {
            proxy_pass         http://api_gateway/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Frontend — Next.js (all other routes) ─────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Internal debug routes ──────────────────────────────────────────
        location /internal/businesses/ {
            rewrite ^/internal/businesses/(.*) /businesses/$1 break;
            proxy_pass         http://business_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location /internal/recommendations/ {
            rewrite ^/internal/recommendations/(.*) /recommendations/$1 break;
            proxy_pass         http://recommendation_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        location /internal/ingest/ {
            rewrite ^/internal/ingest/(.*) /ingest/$1 break;
            proxy_pass         http://ingestion_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
        }

        # ── Health check ───────────────────────────────────────────────────
        location /health {
            proxy_pass http://api_gateway/health;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
